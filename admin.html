<!DOCTYPE html>
<html>
<head>

  <title>FP Admin Panel</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<h1>FP Admin Panel</h1>

<div class="box" id="loginBox">

  <h2>Admin Login</h2>

  <input type="password" id="password" placeholder="Enter Password">

  <button onclick="login()">Login</button>

</div>

<div class="box" id="adminPanel" style="display:none;">

  <h2>Add SKU</h2>

  <input type="text" id="skuName" placeholder="SKU Name">

  <input type="number" id="skuValue" placeholder="KG/Hour">

  <button onclick="addSKU()">Add SKU</button>

  <table>

    <thead>

      <tr>

        <th>SKU</th>
        <th>KG/Hr</th>
        <th>Lines</th>
        <th>Delete</th>

      </tr>

    </thead>

    <tbody id="skuTable"></tbody>

  </table>

</div>

<script src="admin.js"></script>

</body>
</html>
