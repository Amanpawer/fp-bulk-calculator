<!DOCTYPE html>
<html>
<head>

  <title>FP Bulk Calculator</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<h1>FP Bulk Calculator</h1>

<div class="box" id="loginBox">

  <h2>Operator Login</h2>

  <input type="text" id="operatorName" placeholder="Enter Operator Name">

  <button onclick="login()">Login</button>

</div>

<div class="box" id="step1" style="display:none;">

  <h2>Select Tank</h2>

  <select id="tank">

    <option value="">Select Tank</option>

    <option value="fp01">FP01</option>

    <option value="fp02">FP02 / Ronchi</option>

    <option value="fp03">FP03</option>

  </select>

  <button class="smallBtn" onclick="goToLines()">Next</button>

</div>

<div class="box" id="step2" style="display:none;">

  <h2>Select Running Lines</h2>

  <div id="lineContainer"></div>

  <button class="smallBtn" onclick="backTo1()">Back</button>

  <button class="smallBtn" onclick="goToSKU()">Next</button>

</div>

<div class="box" id="step3" style="display:none;">

  <h2>Select SKU</h2>

  <div id="skuContainer"></div>

  <button class="smallBtn" onclick="backTo2()">Back</button>

  <button class="smallBtn" onclick="goToHours()">Next</button>

</div>

<div class="box" id="step4" style="display:none;">

  <h2>Running Hours</h2>

  <input type="number" id="hours" placeholder="Enter Hours">

  <button class="smallBtn" onclick="backTo3()">Back</button>

  <button class="smallBtn" onclick="calculateBulk()">Calculate</button>

</div>

<div class="box" id="step5" style="display:none;">

  <h2>Result</h2>

  <div id="result"></div>

  <button class="smallBtn" onclick="resetAll()">Reset</button>

</div>

<script src="script.js"></script>

</body>
</html>
