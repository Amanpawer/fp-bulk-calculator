<!-- Hours -->
<div class="section">

  <h2>Running Hours</h2>

  <input type="number" id="hours" placeholder="Enter Hours">

  <button onclick="calculateBulk()">Calculate Bulk</button>

  <div id="result"></div>

</div>

<script>

function showLines(){

  document.getElementById("fp01").style.display = "none";
  document.getElementById("fp02").style.display = "none";
  document.getElementById("fp03").style.display = "none";

  let tank = document.getElementById("tankSelect").value;

  if(tank){
    document.getElementById(tank).style.display = "block";
  }

}

function calculateBulk(){

  let hours = Number(document.getElementById("hours").value);

  let total = 0;

  let allSku = document.querySelectorAll(".sku");

  allSku.forEach(function(dropdown){

    total += Number(dropdown.value);

  });

  total = total * hours;

  let mt = total / 1000;

  document.getElementById("result").innerHTML =
    "Total Bulk = " + total.toLocaleString() + " KG<br><br>" +
    "Total Bulk = " + mt.toFixed(2) + " MT";

}

</script>
